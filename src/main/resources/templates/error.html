<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status != null ? status + ' - Thông báo hệ thống' : (errorCode != null ? errorCode + ' - Thông báo hệ thống' : 'Thông báo hệ thống')}">Thông báo hệ thống - Grand Hotel</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>

    <div class="error-card-lux">
        <!-- Logo -->
        <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
            <i class="fa-solid fa-hotel text-warning fs-3" style="color: #d97706 !important;"></i>
            <span class="fw-bold fs-4 text-dark" style="font-weight: 800 !important; letter-spacing: 0.5px;">GRAND HOTEL</span>
        </div>

        <!-- Dynamic Error Code -->
        <div class="error-code-badge" th:text="${status != null ? status : (errorCode != null ? errorCode : '404')}">404</div>

        <!-- Title -->
        <h3 class="fw-bold text-dark mb-2" style="font-weight: 800 !important;" th:text="${error != null ? error : (errorTitle != null ? errorTitle : 'Không Tìm Thấy Trang')}">
            Không Tìm Thấy Trang Yêu Cầu
        </h3>

        <!-- Description -->
        <p class="small mb-4" style="line-height: 1.7; color: #334155; font-weight: 500;" 
           th:text="${message != null and !message.isEmpty() ? message : (errorMessage != null ? errorMessage : 'Đường dẫn bạn yêu cầu không khả dụng, đã bị đổi tên hoặc tạm thời không thể truy cập.')}">
            Đường dẫn bạn yêu cầu không khả dụng, đã bị đổi tên hoặc tạm thời không thể truy cập.
        </p>

        <!-- Hotline support box -->
        <div class="p-3 bg-light rounded-4 border mb-4 small d-inline-flex align-items-center gap-2" style="color: #1e293b; border-color: #cbd5e1 !important;">
            <i class="fa-solid fa-headset text-warning fs-5" style="color: #d97706 !important;"></i>
            <span>Cần trợ giúp ngay? Hotline CSKH: <strong class="text-dark">1900 8888</strong> (24/7)</span>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a th:href="@{/}" class="btn gold-btn rounded-pill px-4 py-2.5 fw-bold small shadow-sm">
                <i class="fa-solid fa-house me-1.5"></i> Về Trang chủ
            </a>
            <a th:href="@{/rooms}" class="btn btn-outline-dark rounded-pill px-4 py-2.5 fw-bold small">
                <i class="fa-solid fa-bed me-1.5"></i> Xem Hạng phòng
            </a>
        </div>
    </div>

</body>
</html>
