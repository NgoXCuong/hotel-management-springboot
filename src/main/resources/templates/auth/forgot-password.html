<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu - Grand Hotel Management</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="alternate icon" type="image/png" th:href="@{/images/favicon.svg}">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="register-page">

    <div class="forgot-card">

        <!-- Back Link -->
        <a th:href="@{/auth/login}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Quay lại Đăng nhập
        </a>

        <!-- Header -->
        <div class="forgot-header">
            <div class="icon-circle">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1>Khôi phục mật khẩu</h1>
            <p>Nhập email đã đăng ký để nhận mã xác thực và liên kết đặt lại mật khẩu</p>
        </div>

        <!-- Alert lỗi -->
        <div th:if="${errorMessage != null}" class="alert-auth alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Alert thành công -->
        <div th:if="${successMessage != null}" class="alert-auth alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Form -->
        <form th:action="@{/auth/forgot-password}" method="post" autocomplete="off">

            <div class="input-group-custom">
                <label for="email" class="form-label-custom">Địa chỉ Email</label>
                <i class="fa-regular fa-envelope input-icon" style="top: calc(50% + 11px)"></i>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Nhập email đã đăng ký"
                       required
                       autofocus>
            </div>

            <button type="submit" class="btn-gold" id="btn-forgot">
                <i class="fa-solid fa-paper-plane me-2"></i> Gửi yêu cầu
            </button>
        </form>

    </div>

</body>

</html>
