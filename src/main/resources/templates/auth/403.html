<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Truy cập bị giới hạn</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="alternate icon" type="image/png" th:href="@{/images/favicon.svg}">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="register-page">

    <div class="error-hero">

        <!-- Shield Icon -->
        <div class="shield-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <!-- Error Code -->
        <div class="error-code">403</div>

        <!-- Gold Divider -->
        <div class="gold-divider"></div>

        <!-- Title -->
        <h1 class="error-title">Truy cập bị giới hạn quyền</h1>

        <!-- Description -->
        <p class="error-description">
            Tài khoản của bạn không có đủ thẩm quyền để truy cập vào phân hệ quản trị
            hoặc chức năng này. Vui lòng kiểm tra lại quyền hạn hoặc đăng nhập bằng
            tài khoản quản lý.
        </p>

        <!-- Action Buttons -->
        <div class="btn-group-custom">
            <a th:href="@{/}" class="btn-custom btn-gold">
                <i class="fa-solid fa-house-chimney me-2"></i> Quay lại Trang chủ
            </a>
            <a th:href="@{/auth/login}" class="btn-custom btn-outline-secondary">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Đổi tài khoản khác
            </a>
        </div>

    </div>

</body>

</html>
