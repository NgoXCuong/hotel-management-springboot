<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Grand Hotel Management</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="alternate icon" type="image/png" th:href="@{/images/favicon.svg}">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="register-page">

    <div class="register-card">

        <!-- Header -->
        <div class="register-header">
            <div class="logo-icon mb-2" style="background: transparent; box-shadow: none;">
                <img th:src="@{/images/favicon.svg}" alt="Grand Hotel Logo" style="width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);">
            </div>
            <h1>Tạo tài khoản khách hàng</h1>
            <p>Trải nghiệm dịch vụ đặt phòng trực tuyến nhanh chóng và nhận ưu đãi độc quyền</p>
        </div>

        <!-- Alert lỗi chung -->
        <div th:if="${errorMessage != null}" class="alert-auth alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Alert thành công -->
        <div th:if="${successMessage != null}" class="alert-auth alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Form Đăng ký -->
        <form th:action="@{/auth/register}" method="post" autocomplete="off" id="registerForm">

            <div class="form-row">

                <!-- ========== CỘT TRÁI ========== -->

                <!-- Họ và tên -->
                <div class="form-group">
                    <label for="fullName" class="form-label-custom">
                        Họ và tên <span style="color:#dc2626">*</span>
                    </label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text"
                               id="fullName"
                               name="fullName"
                               placeholder="Nguyễn Văn A"
                               required>
                    </div>
                </div>

                <!-- Tên đăng nhập -->
                <div class="form-group">
                    <label for="username" class="form-label-custom">
                        Tên đăng nhập <span style="color:#dc2626">*</span>
                    </label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-id-badge input-icon"></i>
                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="nguyenvana"
                               autocomplete="off"
                               required>
                    </div>
                </div>

                <!-- Số điện thoại -->
                <div class="form-group">
                    <label for="phone" class="form-label-custom">
                        Số điện thoại <span style="color:#dc2626">*</span>
                    </label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel"
                               id="phone"
                               name="phone"
                               placeholder="0912 345 678"
                               required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label-custom">
                        Địa chỉ Email <span style="color:#dc2626">*</span>
                    </label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="email@example.com"
                               required>
                    </div>
                </div>

                <!-- Số CCCD / Hộ chiếu -->
                <div class="form-group">
                    <label for="identityNumber" class="form-label-custom">
                        Số CCCD / Hộ chiếu
                    </label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-id-card input-icon"></i>
                        <input type="text"
                               id="identityNumber"
                               name="identityNumber"
                               placeholder="001234567890">
                    </div>
                </div>

                <!-- Mật khẩu -->
                <div class="form-group">
                    <label for="password" class="form-label-custom">
                        Mật khẩu <span style="color:#dc2626">*</span>
                    </label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Tối thiểu 6 ký tự"
                               required
                               autocomplete="new-password"
                               minlength="6">
                        <button type="button" class="toggle-password"
                                onclick="togglePassword('password', 'toggleIcon1')"
                                aria-label="Hiện/ẩn mật khẩu">
                            <i class="fa-regular fa-eye" id="toggleIcon1"></i>
                        </button>
                    </div>
                </div>

                <!-- Xác nhận mật khẩu (full-width) -->
                <div class="form-group full-width">
                    <label for="confirmPassword" class="form-label-custom">
                        Xác nhận mật khẩu <span style="color:#dc2626">*</span>
                    </label>
                    <div class="input-group-custom" style="max-width: 50%; padding-right: 12px;">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Nhập lại mật khẩu"  
                               required
                               autocomplete="new-password">
                        <button type="button" class="toggle-password"
                                onclick="togglePassword('confirmPassword', 'toggleIcon2')"
                                aria-label="Hiện/ẩn xác nhận mật khẩu">
                            <i class="fa-regular fa-eye" id="toggleIcon2"></i>
                        </button>
                    </div>
                    <span id="passwordError" class="field-error" style="display:none">
                        Mật khẩu xác nhận không khớp.
                    </span>
                </div>
                
                <!-- Divider -->
                <hr class="section-divider">
            </div>

            <!-- Điều khoản -->
            <div class="terms-check">
                <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                <label for="agreeTerms">
                    Tôi đồng ý với <a href="#">chính sách lưu trú</a> và
                    <a href="#">điều khoản bảo mật</a> của khách sạn.
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-gold" id="btn-register">
                <i class="fa-solid fa-user-check me-2"></i> Đăng ký ngay
            </button>
        </form>

        <!-- Footer -->
        <div class="card-footer-text">
            Đã có tài khoản?
            <a th:href="@{/auth/login}">Đăng nhập</a>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/auth-register.js}"></script>

</body>

</html>
