<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title layout:fragment="title" th:text="${room.id == null ? 'Thêm mới Phòng' : 'Cập nhật Phòng'}"></title>
</head>
<body>
    <div layout:fragment="content">
        
        <div class="page-header">
            <h1 class="page-title" th:text="${room.id == null ? 'Thêm mới Phòng' : 'Cập nhật Phòng'}"></h1>
            <a th:href="@{/admin/rooms}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-2"></i> Quay lại
            </a>
        </div>

        <div class="card-custom p-4 mx-auto" style="max-width: 700px;">
            <form th:action="@{${room.id == null ? '/admin/rooms/create' : '/admin/rooms/edit/' + room.id}}" 
                  th:object="${room}" method="post">
                
                <input type="hidden" th:field="*{id}" />

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="roomNumber" class="form-label fw-semibold">Số phòng <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="roomNumber" th:field="*{roomNumber}" 
                               th:classappend="${#fields.hasErrors('roomNumber')} ? 'is-invalid' : ''" placeholder="VD: 101, P.201" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="floor" class="form-label fw-semibold">Tầng <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="floor" th:field="*{floor}" 
                               th:classappend="${#fields.hasErrors('floor')} ? 'is-invalid' : ''" required min="1">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}"></div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="roomType" class="form-label fw-semibold">Loại phòng <span class="text-danger">*</span></label>
                        <select class="form-select" id="roomType" th:field="*{roomType}" 
                                th:classappend="${#fields.hasErrors('roomType')} ? 'is-invalid' : ''" required>
                            <option value="">-- Chọn loại phòng --</option>
                            <option th:each="rt : ${roomTypes}" 
                                    th:if="${rt.active}"
                                    th:value="${rt.id}" 
                                    th:text="${rt.name} + ' (' + ${#numbers.formatDecimal(rt.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' đ)'"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}"></div>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="status" class="form-label fw-semibold">Trạng thái ban đầu <span class="text-danger">*</span></label>
                        <select class="form-select" id="status" th:field="*{status}" 
                                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''" required>
                            <option value="AVAILABLE">Sẵn sàng</option>
                            <option value="OCCUPIED">Đang có khách</option>
                            <option value="CLEANING">Đang dọn dẹp</option>
                            <option value="MAINTENANCE">Đang bảo trì</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="description" class="form-label fw-semibold">Ghi chú phòng</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Ví dụ: Hướng cửa sổ, tình trạng vật tư, số giường phụ..."
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/rooms}" class="btn btn-light border px-4">Quay lại danh sách</a>
                    <button type="submit" class="btn btn-gold-custom px-4">
                        <i class="fa-solid fa-floppy-disk me-2"></i> Lưu phòng
                    </button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
