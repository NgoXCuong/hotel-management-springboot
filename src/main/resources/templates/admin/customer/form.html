<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title layout:fragment="title" th:text="${customer.id == null ? 'Tiếp nhận Khách hàng mới' : 'Cập nhật Hồ sơ Khách hàng'}"></title>
    <link rel="stylesheet" th:href="@{/css/admin/customer-form.css}">
</head>
<body>
    <div layout:fragment="content">
        
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4" style="max-width: 860px; margin: 0 auto 24px auto;">
            <div>
                <a th:href="@{/admin/customers}" class="text-decoration-none text-muted small fw-medium mb-1 d-inline-block">
                    <i class="fa-solid fa-arrow-left me-2"></i> Quay lại danh sách
                </a>
                <h1 class="page-title" style="font-size: 22px; font-weight: 700; color: #0f172a;"
                    th:text="${customer.id == null ? 'Tiếp nhận Khách hàng mới' : 'Cập nhật Hồ sơ Khách hàng'}">
                    Tiếp nhận Khách hàng mới
                </h1>
            </div>
            <div th:if="${customer.customerCode != null}">
                <span class="badge bg-light text-dark border px-3 py-2 font-monospace fs-6">
                    <i class="fa-solid fa-id-badge text-warning me-2" style="color: #d97706 !important;"></i>
                    <span th:text="${customer.customerCode}">CUST-000128</span>
                </span>
            </div>
        </div>

        <!-- Form Card -->
        <div class="form-card p-4 p-md-5">
            <form th:action="@{/admin/customers/save}" th:object="${customer}" method="post">
                
                <!-- Hidden Fields -->
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{customerCode}" />
                <input type="hidden" th:field="*{user}" />

                <div class="row g-4 mb-4">
                    <!-- ================= CỘT TRÁI: THÔNG TIN CƠ BẢN ================= -->
                    <div class="col-12 col-md-6 border-end-md pe-md-4">
                        <div class="form-section-title">
                            <i class="fa-solid fa-user"></i>Thông tin liên hệ
                        </div>

                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">
                                Họ và tên khách hàng <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted border-end-0">
                                    <i class="fa-regular fa-user"></i>
                                </span>
                                <input type="text" class="form-control border-start-0 ps-0" id="fullName" th:field="*{fullName}"
                                       placeholder="Ví dụ: Nguyễn Văn An"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <!-- Số điện thoại -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">
                                Số điện thoại liên hệ <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted border-end-0">
                                    <i class="fa-solid fa-phone"></i>
                                </span>
                                <input type="tel" class="form-control border-start-0 ps-0" id="phone" th:field="*{phone}"
                                       placeholder="Ví dụ: 0912345678"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="form-text small text-muted" th:unless="${#fields.hasErrors('phone')}">Số điện thoại 10 số (03x, 05x, 07x, 08x, 09x)</div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Địa chỉ Email
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted border-end-0">
                                    <i class="fa-regular fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" th:field="*{email}"
                                       placeholder="Ví dụ: an.nguyen@example.com"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Ngày sinh -->
                        <div class="mb-3">
                            <label for="dateOfBirth" class="form-label">
                                Ngày sinh
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted border-end-0">
                                    <i class="fa-regular fa-calendar"></i>
                                </span>
                                <input type="date" class="form-control border-start-0 ps-0" id="dateOfBirth" th:field="*{dateOfBirth}"
                                       th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>
                    </div>

                    <!-- ================= CỘT PHẢI: ĐỊNH DANH & ĐỊA CHỈ ================= -->
                    <div class="col-12 col-md-6 ps-md-4">
                        <div class="form-section-title">
                            <i class="fa-solid fa-id-card"></i>Định danh & Địa chỉ
                        </div>

                        <!-- Số CCCD / Hộ chiếu -->
                        <div class="mb-3">
                            <label for="identityNumber" class="form-label">
                                Số CCCD / Hộ chiếu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted border-end-0">
                                    <i class="fa-regular fa-id-card"></i>
                                </span>
                                <input type="text" class="form-control border-start-0 ps-0 font-monospace" id="identityNumber" th:field="*{identityNumber}"
                                       placeholder="Số CCCD 12 chữ số hoặc Hộ chiếu"
                                       th:classappend="${#fields.hasErrors('identityNumber')} ? 'is-invalid' : ''">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('identityNumber')}" th:errors="*{identityNumber}"></div>
                        </div>

                        <!-- Giới tính -->
                        <div class="mb-3">
                            <label class="form-label d-block">Giới tính</label>
                            <div class="d-flex gap-2">
                                <th:block th:each="g : ${genders}">
                                    <input type="radio" class="btn-check" th:id="'gender_' + ${g.name()}" 
                                           th:field="*{gender}" th:value="${g.name()}">
                                    <label class="gender-pill" th:for="'gender_' + ${g.name()}">
                                        <i class="fa-solid" th:classappend="${g.icon} + ' ' + ${g.colorClass}"></i>
                                        <span th:text="${g.displayName}">Nam</span>
                                    </label>
                                </th:block>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                        </div>

                        <!-- Quốc tịch -->
                        <div class="mb-3">
                            <label for="nationality" class="form-label">
                                Quốc tịch
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted border-end-0">
                                    <i class="fa-solid fa-earth-americas"></i>
                                </span>
                                <input type="text" class="form-control border-start-0 ps-0" id="nationality" th:field="*{nationality}"
                                       placeholder="Việt Nam"
                                       th:classappend="${#fields.hasErrors('nationality')} ? 'is-invalid' : ''">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"></div>
                        </div>

                        <!-- Địa chỉ liên hệ -->
                        <div class="mb-3">
                            <label for="address" class="form-label">
                                Địa chỉ liên hệ
                            </label>
                            <textarea class="form-control" id="address" th:field="*{address}" rows="2"
                                      placeholder="Số nhà, đường phố, phường/xã, quận/huyện, tỉnh/thành phố..."
                                      th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>

                        <!-- Trạng thái hồ sơ -->
                        <div class="mb-3" th:if="${customer.id != null}">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" role="switch" id="activeSwitch" th:field="*{active}">
                                <label class="form-check-label fw-semibold text-dark" for="activeSwitch" style="font-size: 13.5px;">
                                    Hồ sơ đang hoạt động
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer Buttons -->
                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/admin/customers}" class="btn btn-light border px-4 py-2" style="border-radius: 8px; font-weight: 500;">
                        <i class="fa-solid fa-arrow-left me-2"></i> Quay lại danh sách
                    </a>
                    <button type="submit" class="btn px-4 py-2 text-white shadow-sm"
                            style="background: #d97706; border-radius: 8px; font-weight: 600; border: none; font-size: 14.5px;">
                        <i class="fa-solid fa-floppy-disk me-2"></i> Lưu hồ sơ
                    </button>
                </div>

            </form>
        </div>

    </div>
</body>
</html>
