<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title layout:fragment="title" th:text="${service.id == null ? 'Thêm mới Dịch vụ' : 'Cập nhật Dịch vụ'}"></title>
    <link rel="stylesheet" th:href="@{/css/admin/service-form.css}">
</head>
<body>
    <div layout:fragment="content">
        
        <div class="page-header">
            <h1 class="page-title" th:text="${service.id == null ? 'Thêm mới Dịch vụ' : 'Cập nhật Dịch vụ'}"></h1>
            <a th:href="@{/admin/services}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-2"></i>Quay lại
            </a>
        </div>

        <div class="card-custom p-4 mx-auto" style="max-width: 650px;">
            <form th:action="@{${service.id == null ? '/admin/services/create' : '/admin/services/edit/' + service.id}}" 
                  th:object="${service}" method="post" enctype="multipart/form-data">
                
                <input type="hidden" th:field="*{id}" />

                <div class="mb-4">
                    <label for="name" class="form-label fw-semibold">Tên dịch vụ <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" 
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="VD: Bữa sáng buffet, Giặt ủi áo sơ mi..." required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <!-- Ảnh minh họa dịch vụ (Cloudinary) -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="fa-solid fa-image text-warning me-1" style="color: #d97706 !important;"></i>
                        Hình ảnh minh họa dịch vụ
                    </label>
                    
                    <div class="service-img-preview-box mb-2" onclick="document.getElementById('serviceImgInput').click()">
                        <!-- Ảnh hiện có hoặc preview mới -->
                        <img id="serviceImgPreview"
                             th:src="${service.imageUrl != null and !service.imageUrl.isEmpty()} ? ${service.imageUrl} : ''"
                             alt="Service Preview"
                             class="service-preview-img"
                             th:classappend="${service.imageUrl == null or service.imageUrl.isEmpty()} ? 'd-none' : ''" />

                        <!-- Placeholder khi chưa có ảnh -->
                        <div id="serviceImgPlaceholder" class="text-center p-3"
                             th:classappend="${service.imageUrl != null and !service.imageUrl.isEmpty()} ? 'd-none' : ''">
                            <i class="fa-solid fa-cloud-arrow-up text-warning mb-2" style="font-size: 28px; color: #d97706 !important;"></i>
                            <div class="fw-semibold text-dark small">Nhấn để chọn ảnh tải lên Cloudinary</div>
                            <div class="text-muted" style="font-size: 11px;">Hỗ trợ JPG, PNG, WEBP (Tối đa 5MB)</div>
                        </div>
                    </div>

                    <input type="file" id="serviceImgInput" name="imageFile" accept="image/jpeg,image/png,image/webp"
                           class="d-none"
                           data-single-preview="#serviceImgPreview"
                           data-placeholder="#serviceImgPlaceholder">
                </div>

                <div class="mb-4">
                    <label for="price" class="form-label fw-semibold">Đơn giá <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="number" step="any" min="0" class="form-control" id="price" th:field="*{price}" 
                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" required>
                        <span class="input-group-text bg-light text-muted fw-medium">VNĐ</span>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">Mô tả chi tiết</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Nhập chi tiết quy cách phục vụ hoặc đơn vị tính (lon, lượt, suất...)"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-5">
                    <div class="form-check form-switch fs-5">
                        <input class="form-check-input shadow-none" type="checkbox" role="switch" id="active" th:field="*{active}">
                        <label class="form-check-label ms-2 mt-1 fs-6 fw-medium text-dark" for="active" style="cursor: pointer;">Cho phép sử dụng dịch vụ này</label>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/services}" class="btn btn-light border px-4">Hủy bỏ</a>
                    <button type="submit" class="btn btn-gold-custom px-4">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Lưu dịch vụ
                    </button>
                </div>
            </form>
        </div>

    </div>

    <th:block layout:fragment="script">
        <script th:src="@{/js/image-upload.js}"></script>
    </th:block>
</body>
</html>
