<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title layout:fragment="title" th:text="${amenity.id == null ? 'Thêm mới Tiện nghi' : 'Cập nhật Tiện nghi'}"></title>
</head>
<body>
    <div layout:fragment="content">
        
        <div class="page-header">
            <h1 class="page-title" th:text="${amenity.id == null ? 'Thêm mới Tiện nghi' : 'Cập nhật Tiện nghi'}"></h1>
            <a th:href="@{/admin/amenities}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-2"></i> Quay lại
            </a>
        </div>

        <div class="card-custom p-4 mx-auto" style="max-width: 750px;">
            <form th:action="@{${amenity.id == null ? '/admin/amenities/create' : '/admin/amenities/edit/' + amenity.id}}" 
                  th:object="${amenity}" method="post">
                
                <input type="hidden" th:field="*{id}" />

                <div class="mb-4">
                    <label for="name" class="form-label fw-semibold">Tên tiện nghi <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" 
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="VD: Wifi tốc độ cao, Bồn tắm massage, Minibar..." required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <!-- BỘ CHỌN BIỂU TƯỢNG HOTEL ICON PICKER -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="fa-solid fa-icons text-warning me-1" style="color: #d97706 !important;"></i>
                        Biểu tượng đại diện <span class="text-danger">*</span>
                    </label>
                    
                    <!-- Ô input chứa mã class FontAwesome -->
                    <input type="hidden" id="icon" th:field="*{icon}" required />
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('icon')}" th:errors="*{icon}"></div>

                    <!-- Vùng hiển thị Hotel Icon Picker -->
                    <div id="hotelIconPickerContainer"></div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">Mô tả chi tiết</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Mô tả công dụng, thông số hoặc vị trí lắp đặt..."
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-5">
                    <div class="form-check form-switch fs-5">
                        <input class="form-check-input shadow-none" type="checkbox" role="switch" id="active" th:field="*{active}">
                        <label class="form-check-label ms-2 mt-1 fs-6 fw-medium text-dark" for="active" style="cursor: pointer;">Cho phép áp dụng tiện nghi này</label>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/amenities}" class="btn btn-light border px-4">Hủy bỏ</a>
                    <button type="submit" class="btn btn-gold-custom px-4">
                        <i class="fa-solid fa-floppy-disk me-2"></i> Lưu tiện nghi
                    </button>
                </div>
            </form>
        </div>

    </div>

    <!-- Script Hotel Icon Picker -->
    <th:block layout:fragment="script">
        <script th:src="@{/js/hotel-icon-picker.js}"></script>
        <script th:src="@{/js/admin/amenity-form.js}"></script>
    </th:block>
</body>
</html>
