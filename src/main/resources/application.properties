spring.application.name=hotel-management

server.port=8080

# C\u1ea5u h\u00ecnh MySQL (s\u1eeda m\u1eadt kh\u1ea9u cho \u0111\u00fang v\u1edbi m\u00e1y c\u1ee7a b\u1ea1n)
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate c\u1ea5u h\u00ecnh
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# T\u1eaft cache Thymeleaf \u0111\u1ec3 s\u1eeda giao di\u1ec7n kh\u00f4ng c\u1ea7n reload server
spring.thymeleaf.cache=false

