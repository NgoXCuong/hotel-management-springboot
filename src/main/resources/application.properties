# ==========================================
# Cấu hình AI Chatbot (Groq Cloud API)
# ==========================================
# Tự động nạp file secret từ local nếu có (file này nằm trong .gitignore)
spring.config.import=optional:classpath:application-secret.properties

groq.api.key=${GROQ_API_KEY:YOUR_GROQ_API_KEY_HERE}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b
groq.api.timeout-seconds=30